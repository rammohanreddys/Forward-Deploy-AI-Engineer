    const tab1Btn = document.getElementById("tab1Btn");
    const tab2Btn = document.getElementById("tab2Btn");
    const tab1Panel = document.getElementById("tab1Panel");
    const tab2Panel = document.getElementById("tab2Panel");
    const searchInput = document.getElementById("searchInput");
    const hideShowAnswersBtn = document.getElementById("hideShowAnswersBtn");
    const maskedNotice = document.getElementById("maskedNotice");
    const questionsTabList = document.getElementById("questionsTabList");
    const answersTabList = document.getElementById("answersTabList");

    let activeTab = "tab1";
    let answersVisible = true;

    function getFilteredQuestions() {
      const term = searchInput.value.trim().toLowerCase();
      if (!term) return questions;
      return questions.filter((q) => {
        const text = [
          `question ${q.num}`,
          `q${q.num}`,
          q.question,
          q.format,
          ...q.options
        ].join(" ").toLowerCase();
        return text.includes(term);
      });
    }

    function renderTab1(items) {
      questionsTabList.innerHTML = items.map((q) => `
        <article class="card">
          <div class="card-meta">
            <span class="q-num">Question ${q.num} of 40</span>
            <span>${q.format}</span>
          </div>
          <h2 class="q-text">${q.question}</h2>
          <ul class="options-list">
            ${q.options.map((opt) => `<li class="option-item">${opt}</li>`).join("")}
          </ul>
        </article>
      `).join("");
    }

    function renderTab2(items) {
      maskedNotice.classList.toggle("hidden", answersVisible);
      if (!answersVisible) {
        answersTabList.innerHTML = items.map((q) => `
          <article class="card">
            <div class="card-meta">
              <span class="q-num">Question ${q.num} of 40</span>
              <span>${q.format} • Answer Hidden</span>
            </div>
            <h2 class="q-text">${q.question}</h2>
          </article>
        `).join("");
        return;
      }

      answersTabList.innerHTML = items.map((q) => `
        <article class="card">
          <div class="card-meta">
            <span class="q-num">Question ${q.num} of 40</span>
            <span>${q.format}</span>
          </div>
          <h2 class="q-text">${q.question}</h2>
          <ul class="options-list">
            ${q.options.map((opt, idx) => {
              const isCorrect = q.correctIndices.includes(idx);
              const badge = isCorrect ? `<span class="correct-tag">Correct</span>` : "";
              const expl = q.explanations && q.explanations[idx]
                ? `<span class="expl">${q.explanations[idx]}</span>`
                : "";
              return `
                <li class="option-item ${isCorrect ? "correct" : ""}">
                  ${badge}<strong>${opt}</strong>
                  ${expl}
                </li>
              `;
            }).join("")}
          </ul>
          <div class="answer-summary">
            <strong>Answer:</strong> ${q.answerText}
          </div>
        </article>
      `).join("");
    }

    function renderAll() {
      const filtered = getFilteredQuestions();
      renderTab1(filtered);
      renderTab2(filtered);
    }

    function switchTab(tabName) {
      activeTab = tabName;
      const isTab1 = tabName === "tab1";

      tab1Btn.classList.toggle("active", isTab1);
      tab1Btn.setAttribute("aria-selected", String(isTab1));
      tab2Btn.classList.toggle("active", !isTab1);
      tab2Btn.setAttribute("aria-selected", String(!isTab1));

      tab1Panel.classList.toggle("hidden", !isTab1);
      tab2Panel.classList.toggle("hidden", isTab1);
      hideShowAnswersBtn.classList.toggle("hidden", isTab1);
    }

    tab1Btn.addEventListener("click", () => switchTab("tab1"));
    tab2Btn.addEventListener("click", () => switchTab("tab2"));

    hideShowAnswersBtn.addEventListener("click", () => {
      answersVisible = !answersVisible;
      hideShowAnswersBtn.textContent = answersVisible ? "Hide Answers" : "Show Answers";
      renderTab2(getFilteredQuestions());
    });

    searchInput.addEventListener("input", renderAll);

    renderAll();
  </script>
